# Docker Compose override for development
# Make Docker targets explicitly include this override to preserve hot reload.
# Usage: make docker-dev

version: '3.9'

services:
  pybackend:
    # Mount source code for development
    volumes:
      - ../packages/pybackend:/app
      - made-data:/app/.made
      - made-workspace:/workspace
      # Anonymous volume so the bind mount above doesn't shadow the venv
      # that was built inside the image during `docker build`.
      - /app/.venv
    # Enable hot reloading
    command: ["uv", "run", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "3000", "--reload"]
    environment:
      - PORT=3000
      - PYTHONPATH=/app

volumes:
  made-data:
  made-workspace:
