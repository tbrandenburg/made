name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-assurance:
    name: Quality Assurance (Lint + Format + Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Install dependencies
        run: make install
      
      - name: Run QA (lint + format + unit tests with warnings)
        run: make qa-quick

      - name: Check source file sizes
        run: |
          find packages/frontend/src packages/pybackend \
            \( -name "*.ts" -o -name "*.tsx" -o -name "*.py" \) \
            ! -path "*/node_modules/*" ! -path "*/.venv/*" \
            ! -name "*.test.*" ! -name "test_*" \
          | while read f; do
              lines=$(wc -l < "$f")
              if [ "$lines" -gt 500 ]; then
                echo "::warning file=${f}::${f} has ${lines} lines (guideline: 500)"
              fi
            done

      - name: Check test file sizes and test:source ratio
        run: |
          # --- Absolute size: both frontend and backend ---
          find packages/frontend/src packages/pybackend/tests \
            \( -name "*.test.tsx" -o -name "*.test.ts" -o -name "test_*.py" \) \
            ! -path "*/node_modules/*" ! -path "*/.venv/*" \
          | while read tf; do
              lines=$(wc -l < "$tf")
              if [ "$lines" -gt 500 ]; then
                echo "::warning file=${tf}::${tf} has ${lines} lines (guideline: 500)"
              fi
            done

          # --- Test:source ratio: TypeScript ---
          find packages/frontend/src -name "*.test.tsx" -o -name "*.test.ts" \
          | while read tf; do
              src="${tf%.test.*}.tsx"
              [ -f "$src" ] || src="${tf%.test.*}.ts"
              if [ -f "$src" ]; then
                tlines=$(wc -l < "$tf"); slines=$(wc -l < "$src")
                ratio=$(( tlines / (slines + 1) ))
                if [ "$ratio" -gt 2 ]; then
                  echo "::warning file=${tf}::Test:source ratio ${ratio}:1 exceeds 2:1 (${tlines} test vs ${slines} source lines)"
                fi
              fi
            done

          # --- Test:source ratio: Python ---
          find packages/pybackend/tests/unit -name "test_*.py" | while read tf; do
              module=$(basename "$tf" | sed 's/^test_//')
              src=$(find packages/pybackend -maxdepth 1 -name "$module" ! -path "*/tests/*")
              if [ -f "$src" ]; then
                tlines=$(wc -l < "$tf"); slines=$(wc -l < "$src")
                ratio=$(( tlines / (slines + 1) ))
                if [ "$ratio" -gt 2 ]; then
                  echo "::warning file=${tf}::Test:source ratio ${ratio}:1 exceeds 2:1 (${tlines} test vs ${slines} source lines)"
                fi
              fi
            done

      - name: Run security audit
        run: make security-audit

  test-coverage:
    name: Python Backend Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Install dependencies
        run: make install
      
      - name: Run backend tests with coverage
        run: make test-coverage

  system-tests:
    name: System tests (E2E)
    runs-on: ubuntu-latest
    needs:
      - quality-assurance
      - test-coverage
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Install dependencies
        run: make install
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run system tests
        run: make system-test
      
      - name: Upload frontend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-logs
          path: |
            frontend.log
            packages/pybackend/.coverage
            packages/pybackend/htmlcov/
          if-no-files-found: ignore
