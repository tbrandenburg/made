name: Omnigent Runner

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Session timeout in minutes"
        required: false
        default: "30"
        type: string

concurrency:
  group: omnigent-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omnigent:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # small buffer above 30-minute tunnel lifetime

    env:
      PREVIEW_TIMEOUT_MINUTES: ${{ github.event.inputs.timeout_minutes || '30' }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify triggering actor is repo admin
        id: admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
        run: |
          permission=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/collaborators/$TRIGGER_ACTOR/permission" \
            --jq '.permission // ""' 2>/dev/null || echo '')
          if [[ "$permission" == "admin" ]]; then
            echo "is_admin=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_admin=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require admin privileges for Omnigent runner
        if: ${{ steps.admin.outputs.is_admin != 'true' }}
        run: |
          echo "::error::Omnigent runner skipped — requires repository admin privileges. Triggering actor: ${{ github.triggering_actor }}"
          exit 1

      - name: Set up Python
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tmux
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux

      - name: Install UV
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # ------------------------------------------------------
      # Install OpenCode (binary install)
      # ------------------------------------------------------
      - name: Install opencode
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        run: |
          set -euo pipefail
          INSTALL_DIR="$HOME/.opencode/bin"
          mkdir -p "$INSTALL_DIR"

          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT
          ARCHIVE_PATH="$TMPDIR/opencode.tar.gz"
          # Pinned (not "latest"): Omnigent 0.9.0 only supports the OpenCode
          # native harness within [1.17.7, 1.18.0) (see
          # opencode_native_client.OPENCODE_MIN_VERSION /
          # OPENCODE_MAX_VERSION_EXCLUSIVE). A newer opencode (e.g. latest,
          # 1.18.18) is rejected as "outdated"/unconfigured by Omnigent's own
          # readiness gate, so pin to the newest release under 1.18.0.
          DOWNLOAD_URL="https://github.com/anomalyco/opencode/releases/download/v1.17.20/opencode-linux-x64.tar.gz"

          download_with_retry() {
            local url="$1"
            local output="$2"
            local max_attempts=3

            echo "🔄 Downloading OpenCode CLI from GitHub releases..."

            for attempt in $(seq 1 $max_attempts); do
              echo "📥 Attempt $attempt/$max_attempts using curl..."
              if curl --connect-timeout 30 --max-time 120 --retry-connrefused \
                      --fail --silent --show-error --location \
                      "$url" -o "$output"; then
                echo "✅ Download successful with curl on attempt $attempt"
                return 0
              else
                local exit_code=$?
                echo "❌ curl attempt $attempt failed (exit code: $exit_code)"
                if [ $attempt -lt $max_attempts ]; then
                  local delay=$((attempt * 5))
                  echo "⏳ Waiting ${delay}s before retry..."
                  sleep $delay
                fi
              fi
            done

            echo "🔄 Trying fallback method with wget..."
            if wget --timeout=30 --tries=2 --waitretry=5 -q "$url" -O "$output"; then
              echo "✅ Download successful with wget fallback"
              return 0
            else
              echo "❌ wget fallback also failed"
              return 1
            fi
          }

          if ! download_with_retry "$DOWNLOAD_URL" "$ARCHIVE_PATH"; then
            echo "💥 Failed to download OpenCode CLI after all retry attempts and fallbacks"
            exit 1
          fi

          if [ ! -f "$ARCHIVE_PATH" ] || [ ! -s "$ARCHIVE_PATH" ]; then
            echo "❌ Downloaded file is missing or empty"
            exit 1
          fi

          file_size=$(stat -f%z "$ARCHIVE_PATH" 2>/dev/null || stat -c%s "$ARCHIVE_PATH" 2>/dev/null || echo "0")
          if [ "$file_size" -lt 100000 ]; then
            echo "❌ Downloaded file seems too small ($file_size bytes), likely corrupted"
            exit 1
          fi

          echo "✅ Downloaded file validated ($file_size bytes)"

          tar -xzf "$ARCHIVE_PATH" -C "$TMPDIR"
          install "$TMPDIR/opencode" "$INSTALL_DIR/opencode"

          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      # ------------------------------------------------------
      # Configure OpenCode
      # ------------------------------------------------------
      - name: Configure opencode
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        run: |
          mkdir -p "$HOME/.config/opencode"
          cp .github/opencode/config.json "$HOME/.config/opencode/config.json"

          # Pin the model to the free "opencode/big-pickle" (no credentials
          # required) for this workflow only — done here, not in the shared
          # .github/opencode/config.json, to avoid changing behavior for
          # other workflows that copy that same file. Pinning matters
          # because Omnigent's own readiness gate for the OpenCode harness
          # requires a provider credential env var to be present (see the
          # "Start Omnigent" step); without a pinned model, opencode detects
          # that credential and silently switches its default model away
          # from big-pickle to a paid provider model, which then fails with
          # "Missing Authentication header" since the credential is a
          # placeholder, not a real key.
          python3 -c "
          import json
          with open('$HOME/.config/opencode/config.json') as f:
              config = json.load(f)
          config['model'] = 'opencode/big-pickle'
          with open('$HOME/.config/opencode/config.json', 'w') as f:
              json.dump(config, f, indent=2)
          "

          if [ -s "$HOME/.config/opencode/config.json" ]; then
            echo "✅ config.json is present and non-empty"
          else
            echo "❌ config.json is missing or empty"
            exit 1
          fi

      - name: Prepare opencode skills directory
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        run: mkdir -p "$HOME/.opencode/skills"

      # ------------------------------------------------------
      # Install Omnigent
      # ------------------------------------------------------
      - name: Install Omnigent
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        run: |
          echo "🔧 Installing Omnigent..."
          curl -fsSL https://omnigent.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Omnigent install
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        run: |
          which omni
          omni --version || true

      - name: Install latest ngrok CLI (v4)
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        run: |
          echo "🔧 Installing official ngrok CLI (v4)..."
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | \
            sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | \
            sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -y
          sudo apt-get install -y ngrok
          echo "✅ Installed $(ngrok version)"

      # ------------------------------------------------------
      # Start Omnigent (in the checked-out repo as its workspace)
      # ------------------------------------------------------
      - name: Start ngrok tunnel (v4 CLI, verbose)
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        id: ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          echo "🌐 Establishing ngrok tunnel to Omnigent (port 6767)..."
          nohup ngrok http 6767 --log=stdout --pooling-enabled > ngrok.log 2>&1 &
          NGROK_PID=$!
          echo "🧩 ngrok process started with PID $NGROK_PID"
          sleep 3

          echo "⏳ Waiting for ngrok API (http://127.0.0.1:4040) to become available..."
          for i in {1..30}; do
            url=$(curl -s --max-time 2 http://127.0.0.1:4040/api/tunnels | grep -o 'https://[^"]*' | head -n 1 || true)
            if [ -n "$url" ]; then
              echo "✅ ngrok tunnel established successfully: $url"
              echo "tunnel_url=$url" >> $GITHUB_OUTPUT
              break
            fi

            echo "   ...still waiting ($i/30)"
            if (( i % 5 == 0 )); then
              echo "🔍 Partial ngrok log:"
              tail -n 10 ngrok.log || true
            fi
            sleep 2
          done

          if [ -z "$url" ]; then
            echo "❌ ngrok tunnel failed to start within timeout."
            cat ngrok.log || true
            kill $NGROK_PID || true
            exit 1
          fi

          {
            echo "### 🌐 Omnigent tunnel URL"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------
      - name: Start Omnigent (server + local host)
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        id: omnigent
        env:
          # The web UI is reached through the ngrok tunnel origin, not
          # loopback, so it must be explicitly trusted or the server's
          # CSRF guard (require_trusted_origin) rejects session-start and
          # file-upload requests with 403 Forbidden.
          OMNIGENT_WS_ALLOWED_ORIGINS: ${{ steps.ngrok.outputs.tunnel_url }}
          # Omnigent's own readiness gate for the "opencode-native" harness
          # (harness_is_configured / opencode_auth_summary) requires ANY
          # recognized provider credential to be present, or it refuses to
          # dispatch the session with "harness_not_configured" — even though
          # opencode itself needs none here. opencode/big-pickle (see
          # .github/opencode/config.json) is a free model that runs with a
          # completely empty $HOME/auth.json (verified locally), so this
          # value is never actually used to authenticate anything; it only
          # satisfies Omnigent's own precondition check.
          OPENROUTER_API_KEY: unused-omnigent-readiness-placeholder
        run: |
          echo "🚀 Starting Omnigent (background server + local host) in $(pwd)..."
          echo "🔐 Trusting origin: $OMNIGENT_WS_ALLOWED_ORIGINS"
          # `omni host ""` spawns a local background server AND attaches this
          # machine as an execution host in one step; without the host
          # attach, the web UI shows "No hosts" and sessions can't launch.
          nohup omni host "" > omnigent.log 2>&1 &
          echo "🧩 omni host process started with PID $!"

          echo "⏳ Waiting for Omnigent server to become available on port 6767..."
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:6767 > /dev/null 2>&1; then
              echo "✅ Omnigent server is ready on port 6767"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Omnigent server never became ready"
              echo "🔍 omnigent.log:"
              cat omnigent.log || true
              exit 1
            fi
            sleep 2
          done

          omni server status || true
          echo "🔍 omnigent.log so far:"
          cat omnigent.log || true

      - name: Send Telegram message
        if: ${{ steps.admin.outputs.is_admin == 'true' && success() }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          TUNNEL_URL: ${{ steps.ngrok.outputs.tunnel_url }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          TIMEOUT_MINUTES=${{ env.PREVIEW_TIMEOUT_MINUTES }}

          ESCAPED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[-_*\[\]()~`>#+=|{}.!]/\\&/g')
          ESCAPED_ACTOR=$(echo "$ACTOR" | sed 's/[-_*\[\]()~`>#+=|{}.!]/\\&/g')
          ESCAPED_REPO=$(echo "$REPO" | sed 's/[-_*\[\]()~`>#+=|{}.!]/\\&/g')
          ESCAPED_REPO_NAME=$(echo "$REPO_NAME" | sed 's/[-_*\[\]()~`>#+=|{}.!]/\\&/g')

          MSG=$(printf '%s\n' \
            "🤖 *Omnigent runner started for $ESCAPED_REPO*" \
            "" \
            "*Branch:* $ESCAPED_BRANCH" \
            "*Triggered by:* $ESCAPED_ACTOR" \
            "" \
            "*Omnigent Web UI:* [Open Session]($TUNNEL_URL)" \
            "*Workflow:* [View Run]($WORKFLOW_URL)" \
            "" \
            "ℹ️ Pick *OpenCode* in the harness picker, then set *Working directory* to the repo checkout \\(browse into \`work/$ESCAPED_REPO_NAME/$ESCAPED_REPO_NAME\`\\) before starting a session\\." \
            "⏳ *This session will expire in ${TIMEOUT_MINUTES} minutes\.*"
          )

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "parse_mode=MarkdownV2" \
            --data-urlencode "text=$MSG"

      - name: Keep Omnigent + ngrok alive
        if: ${{ steps.admin.outputs.is_admin == 'true' }}
        run: |
          echo "⏳ Keeping Omnigent session alive for $PREVIEW_TIMEOUT_MINUTES minutes..."
          sleep $(( PREVIEW_TIMEOUT_MINUTES * 60 ))
