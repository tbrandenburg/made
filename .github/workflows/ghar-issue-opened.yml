---
name: GHAR - Auto Issue Investigation

'on':
  issues:
    types: [opened]
  workflow_dispatch:
    # Allow manual triggering for testing
    inputs:
      issue_number:
        description: 'Issue number to investigate'
        required: true
        type: string

jobs:
  investigate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.author_association == 'OWNER' ||
      github.event.issue.author_association == 'MEMBER' ||
      github.event.issue.author_association == 'COLLABORATOR'
    uses: ./.github/workflows/core-opencode-run.yml
    with:
      run-name: issue-investigation
      command: ghar-issue-investigate
      prompt: >-
        ${{ github.event.issue.number || github.event.inputs.issue_number }}
      timeout-minutes: 30
    permissions:
      # Required permissions for the job to investigate and comment on issues
      issues: write
      pull-requests: read
      contents: read
    secrets: inherit
