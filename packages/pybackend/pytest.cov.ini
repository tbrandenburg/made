[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -n auto -m "not integration" --cov=. --cov-branch --cov-report=term-missing
markers =
    unit: Unit tests
    system: System integration tests
    integration: Integration tests requiring real external agent CLIs (opt-in, not run by default)
    slow: Slow running tests
